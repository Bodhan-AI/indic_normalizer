[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indic_normalizer"
version = "0.1.0"
description = "Lightweight, pure-Python text normalizer for TTS across the 22 scheduled Indian languages (+ English), with LaTeX-to-speech."
readme = "README.md"
requires-python = ">=3.10"  # vendored engine uses PEP 604 unions (X | None)
license = { text = "MIT" }
authors = [{ name = "Bodhan AI" }]
keywords = ["indic", "tts", "text-normalization", "number-to-words", "latex", "speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No runtime dependencies — pure standard library.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["indic_normalizer*"]

[tool.setuptools.package-data]
"*" = ["*.tsv"]
